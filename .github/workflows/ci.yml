name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The base install deliberately excludes torch. The suite must pass
      # without it, without Ollama and without network access.
      - name: Install
        run: pip install -e "backend[dev]"

      - name: Lint
        run: ruff check backend

      - name: Test
        run: pytest backend/tests -q

      - name: CLI smoke test
        env:
          EDGERAG_DATA_DIR: ${{ runner.temp }}/edgerag-ci
          EDGERAG_EMBEDDING__PROVIDER: hash-dev
          EDGERAG_RERANKER__PROVIDER: none
        run: |
          python -m edgerag.cli version
          python -m edgerag.cli doctor || true   # reports Ollama absent, which is expected here
          python -m edgerag.cli demo
          python -m edgerag.cli query "reciprocal rank fusion" --kb "EdgeRAG Demo" --retrieval-only

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci || npm install

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t edgerag:ci .
